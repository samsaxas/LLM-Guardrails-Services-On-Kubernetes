name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - name: Detection-quality gate (held-out split)
        run: python eval/evaluate.py --split test --min-f1 0.90 --max-fpr 0.05
      - name: Build image
        run: docker build -t guardrails-service:ci .
