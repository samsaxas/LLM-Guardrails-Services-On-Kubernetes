# EXAMPLE ONLY - do not commit a real key. The README creates the real Secret with:
#   kubectl -n guardrails create secret generic guardrails-secrets --from-literal=API_KEY="$(openssl rand -hex 24)"
apiVersion: v1
kind: Secret
metadata:
  name: guardrails-secrets
  namespace: guardrails
type: Opaque
stringData:
  API_KEY: CHANGE_ME
