# Must be REJECTED by guardrails-disallow-privileged
apiVersion: v1
kind: Pod
metadata:
  name: bad-privileged
  namespace: guardrails
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
      resources:
        limits: { cpu: 100m, memory: 64Mi }
